name: MoneyBrief daily operations

on:
  schedule:
    - cron: "45 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate without writing the Notion briefing"
        required: false
        default: false
        type: boolean

concurrency:
  group: moneybrief-daily-operations
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sns_harness
    env:
      TZ: Asia/Seoul
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_SNS_DATABASE_ID: ${{ secrets.NOTION_SNS_DATABASE_ID }}
      NOTION_OPERATIONS_DATABASE_ID: ${{ secrets.NOTION_OPERATIONS_DATABASE_ID }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sns_harness/pyproject.toml
      - run: python -m pip install .
      - name: Collect Threads insights
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          python -m sns_harness metrics collect --window 24h
          python -m sns_harness metrics collect --window 72h
          python -m sns_harness metrics collect --window 7d
      - name: Build daily operations briefing
        shell: bash
        run: |
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            result=$(python -m sns_harness operations evaluate --days 30)
          else
            python -m sns_harness operations setup-schema
            result=$(python -m sns_harness operations brief --date today --days 30)
          fi
          echo "$result"
          echo "### MoneyBrief operations result" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
