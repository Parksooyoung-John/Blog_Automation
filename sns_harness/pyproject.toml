[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "j2g-sns-harness"
version = "0.1.0"
description = "Tistory to Threads approval-first publishing harness"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "openai>=1.68,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "regex>=2024.11.6",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "responses>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
sns-harness = "sns_harness.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sns_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
